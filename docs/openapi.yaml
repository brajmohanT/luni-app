openapi: 3.1.0
info:
  title: Luni API
  version: 2.2.0
  description: |
    API contract for the forced-update Luni mobile application. This version uses one canonical companion conversation per user.
    Any unmatched route returns 404 ROUTE_NOT_FOUND with the ApiError schema.
servers:
  - url: http://localhost:8080
    description: Local development
security:
  - bearerAuth: []
paths:
  /health:
    get:
      operationId: getHealth
      summary: Check that the process is running
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/AppVersion'
        - $ref: '#/components/parameters/AppBuild'
        - $ref: '#/components/parameters/Platform'
        - $ref: '#/components/parameters/PlatformVersion'
      security: []
      responses:
        '200':
          description: Process is live
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Liveness'
  /ready:
    get:
      operationId: getReadiness
      summary: Check that the process can accept traffic and reach the database
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/AppVersion'
        - $ref: '#/components/parameters/AppBuild'
        - $ref: '#/components/parameters/Platform'
        - $ref: '#/components/parameters/PlatformVersion'
      security: []
      responses:
        '200':
          description: Application is ready
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ready'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /me:
    get:
      operationId: getMyProfile
      summary: Get the authenticated user's profile and onboarding state
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/AppVersion'
        - $ref: '#/components/parameters/AppBuild'
        - $ref: '#/components/parameters/Platform'
        - $ref: '#/components/parameters/PlatformVersion'
      responses:
        '200':
          description: Stored profile or defaults for a first-time account
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/EmailNotConfirmed'
        '423':
          $ref: '#/components/responses/AccountDeletionInProgress'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceDraining'
    patch:
      operationId: updateMyProfile
      summary: Create or update the authenticated user's profile
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/AppVersion'
        - $ref: '#/components/parameters/AppBuild'
        - $ref: '#/components/parameters/Platform'
        - $ref: '#/components/parameters/PlatformVersion'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProfileRequest'
      responses:
        '200':
          description: Complete updated profile
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/EmailNotConfirmed'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '423':
          $ref: '#/components/responses/AccountDeletionInProgress'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceDraining'
    delete:
      operationId: deleteMyAccount
      summary: Request permanent deletion of the authenticated account
      description: Starting deletion requires an interactive Supabase sign-in within the previous 10 minutes. Repeated requests return the original request time.
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/AppVersion'
        - $ref: '#/components/parameters/AppBuild'
        - $ref: '#/components/parameters/Platform'
        - $ref: '#/components/parameters/PlatformVersion'
      responses:
        '202':
          description: Account deletion was accepted for asynchronous processing
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountDeletionAccepted'
        '401':
          $ref: '#/components/responses/AccountDeletionAuthentication'
        '403':
          $ref: '#/components/responses/EmailNotConfirmed'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceDraining'
  /me/onboarding/complete:
    post:
      operationId: completeMyOnboarding
      summary: Mark onboarding complete after the preferred name is saved
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/AppVersion'
        - $ref: '#/components/parameters/AppBuild'
        - $ref: '#/components/parameters/Platform'
        - $ref: '#/components/parameters/PlatformVersion'
      responses:
        '200':
          description: Complete profile with the original or newly assigned completion time
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/EmailNotConfirmed'
        '409':
          $ref: '#/components/responses/OnboardingProfileIncomplete'
        '423':
          $ref: '#/components/responses/AccountDeletionInProgress'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceDraining'
  /conversations/companion:
    put:
      operationId: putCompanionConversation
      summary: Create or return the authenticated user's companion conversation
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/AppVersion'
        - $ref: '#/components/parameters/AppBuild'
        - $ref: '#/components/parameters/Platform'
        - $ref: '#/components/parameters/PlatformVersion'
      responses:
        '200':
          description: Canonical companion conversation
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompanionConversationResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/EmailNotConfirmed'
        '409':
          $ref: '#/components/responses/OnboardingRequired'
        '423':
          $ref: '#/components/responses/AccountDeletionInProgress'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceDraining'
  /conversations/companion/messages:
    get:
      operationId: getCompanionMessages
      summary: Load the authenticated user's companion conversation and recent messages
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/AppVersion'
        - $ref: '#/components/parameters/AppBuild'
        - $ref: '#/components/parameters/Platform'
        - $ref: '#/components/parameters/PlatformVersion'
        - $ref: '#/components/parameters/MessagePageLimit'
        - $ref: '#/components/parameters/MessageCursor'
      responses:
        '200':
          description: One page of messages in chronological order, starting with the newest page
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompanionMessagesResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/EmailNotConfirmed'
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/CompanionConversationNotFound'
        '423':
          $ref: '#/components/responses/AccountDeletionInProgress'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceDraining'
  /messages/{messageId}/reports:
    post:
      operationId: reportAssistantMessage
      summary: Report an assistant message in the authenticated user's companion conversation
      description: |
        The server verifies ownership and the assistant role, and snapshots the stored message text
        and available generation metadata. No automatic action is taken on the message or account.
        Reports are reviewed and resolved manually. Reports, including resolved reports, are
        intended to be manually deleted 30 days after submission; the API does not enforce expiry.
        Account deletion deletes all reports submitted by that account, including their text
        snapshots and optional explanations. Reports from active accounts remain until manual deletion.
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/AppVersion'
        - $ref: '#/components/parameters/AppBuild'
        - $ref: '#/components/parameters/Platform'
        - $ref: '#/components/parameters/PlatformVersion'
        - name: messageId
          in: path
          required: true
          description: Persisted ID of an assistant message, including the initial companion greeting.
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MessageReportRequest'
      responses:
        '201':
          description: Report received
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageReportReceipt'
        '200':
          description: Original receipt replayed for the same client request ID and payload
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageReportReceipt'
        '400':
          $ref: '#/components/responses/InvalidReportRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/EmailNotConfirmed'
        '404':
          $ref: '#/components/responses/ReportMessageNotFound'
        '409':
          $ref: '#/components/responses/ReportRequestConflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '423':
          $ref: '#/components/responses/AccountDeletionInProgress'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceDraining'
  /chat:
    post:
      operationId: sendChatMessage
      summary: Save a user message and generate a companion reply
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/AppVersion'
        - $ref: '#/components/parameters/AppBuild'
        - $ref: '#/components/parameters/Platform'
        - $ref: '#/components/parameters/PlatformVersion'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatRequest'
      responses:
        '200':
          description: Reply generated, or the completed result replayed for a duplicate client request ID
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatResponse'
        '400':
          $ref: '#/components/responses/InvalidChatRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/EmailNotConfirmed'
        '404':
          $ref: '#/components/responses/ChatResourceNotFound'
        '409':
          $ref: '#/components/responses/ChatConflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '423':
          $ref: '#/components/responses/AccountDeletionInProgress'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceDraining'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Supabase session access token.
  headers:
    RequestId:
      description: Request correlation UUID. The server always returns this header.
      schema:
        type: string
        format: uuid
    RetryAfter:
      description: Seconds to wait before retrying a temporarily blocked chat request.
      schema:
        type: integer
        minimum: 1
  parameters:
    RequestId:
      name: X-Request-Id
      in: header
      required: false
      description: Optional request correlation UUID. The server reuses a valid UUID and otherwise generates one.
      schema:
        type: string
        format: uuid
    AppVersion:
      name: X-App-Version
      in: header
      required: false
      description: Mobile application semantic version, used for compatibility and release-level observability.
      schema:
        type: string
        pattern: '^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(?:-[0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*)?(?:\+[0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*)?$'
        examples: ['1.0.0', '1.2.0-beta.1']
    AppBuild:
      name: X-App-Build
      in: header
      required: false
      description: Native application build identifier, used with X-App-Version for release-level observability.
      schema:
        type: string
        minLength: 1
        examples: ['42', '20260318.1']
    Platform:
      name: X-Platform
      in: header
      required: false
      description: Mobile platform that issued the request.
      schema:
        type: string
        enum: [android, ios]
    PlatformVersion:
      name: X-Platform-Version
      in: header
      required: false
      description: Mobile operating-system version, used for platform-specific diagnostics.
      schema:
        type: string
        minLength: 1
        examples: ['15', '18.3']
    MessagePageLimit:
      name: limit
      in: query
      required: false
      description: Number of messages to return. Defaults to 50.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
    MessageCursor:
      name: cursor
      in: query
      required: false
      description: Opaque cursor returned by the previous page. Requests messages older than that page.
      schema:
        type: string
        minLength: 1
        maxLength: 512
  responses:
    Unauthorized:
      description: Missing, invalid, or expired bearer token
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            oneOf:
              - $ref: '#/components/schemas/MissingAccessTokenError'
              - $ref: '#/components/schemas/InvalidAccessTokenError'
    AccountDeletionAuthentication:
      description: Bearer authentication failed or the user must sign in again before deleting the account
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            oneOf:
              - $ref: '#/components/schemas/MissingAccessTokenError'
              - $ref: '#/components/schemas/InvalidAccessTokenError'
              - $ref: '#/components/schemas/RecentAuthenticationRequiredError'
    EmailNotConfirmed:
      description: The authenticated Supabase account has no confirmed email address
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/EmailNotConfirmedError'
    AccountDeletionInProgress:
      description: The account has an active deletion request and cannot access application data
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AccountDeletionInProgressError'
    ChatResourceNotFound:
      description: A stored retry conversation or requested reply target was not found
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            oneOf:
              - $ref: '#/components/schemas/ConversationNotFoundError'
              - $ref: '#/components/schemas/ReplyTargetNotFoundError'
    ReportMessageNotFound:
      description: Message does not exist, is not an assistant message, or is not owned by the authenticated user
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ReportMessageNotFoundError'
    ReportRequestConflict:
      description: The client request ID was already used for a different message, reason, or explanation
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ReportRequestPayloadMismatchError'
    CompanionConversationNotFound:
      description: The authenticated user has no companion conversation
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CompanionConversationNotFoundError'
    ValidationError:
      description: Request body or route parameter failed validation
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ValidationError'
    InvalidChatRequest:
      description: Invalid JSON or a chat request that failed validation
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            oneOf:
              - $ref: '#/components/schemas/InvalidJsonError'
              - $ref: '#/components/schemas/ValidationError'
    InvalidReportRequest:
      description: Invalid JSON, message ID, or report request body
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            oneOf:
              - $ref: '#/components/schemas/InvalidJsonError'
              - $ref: '#/components/schemas/ValidationError'
    ChatConflict:
      description: Onboarding is incomplete, a request ID payload differs, a duplicate request is processing, or the companion conversation is busy. Retry-After is present only for CHAT_REQUEST_IN_PROGRESS and CONVERSATION_BUSY.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/json:
          schema:
            oneOf:
              - $ref: '#/components/schemas/ChatRequestInProgressError'
              - $ref: '#/components/schemas/ChatRequestPayloadMismatchError'
              - $ref: '#/components/schemas/ConversationBusyError'
              - $ref: '#/components/schemas/OnboardingRequiredError'
    OnboardingRequired:
      description: The user must complete onboarding before creating a companion conversation
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/OnboardingRequiredError'
    OnboardingProfileIncomplete:
      description: The user must save a preferred name before completing onboarding
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/OnboardingProfileIncompleteError'
    PayloadTooLarge:
      description: JSON request body exceeds 16 KB
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/PayloadTooLargeError'
    ServiceDraining:
      description: Application is shutting down and rejects new requests
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ServiceDrainingError'
    ServiceUnavailable:
      description: Application cannot serve readiness traffic
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ServiceUnavailableError'
    InternalError:
      description: Unexpected server or provider failure
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/InternalError'
  schemas:
    ConversationStyle:
      type: string
      description: Selects the server-owned tone instructions used for future companion replies.
      enum:
        - warm_balanced
        - gentle_reassuring
        - playful_casual
        - direct_thoughtful
    Profile:
      type: object
      additionalProperties: false
      required:
        - email
        - preferredName
        - conversationStyle
        - onboardingCompletedAt
        - profileVersion
      properties:
        email:
          type: string
          format: email
        preferredName:
          type: [string, 'null']
          minLength: 1
          maxLength: 40
          description: User-provided profile data that the companion may use when addressing the user.
        conversationStyle:
          $ref: '#/components/schemas/ConversationStyle'
        onboardingCompletedAt:
          type: [string, 'null']
          format: date-time
        profileVersion:
          type: integer
          minimum: 0
          description: Zero identifies a first-time account with no application user row.
    UpdateProfileRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        preferredName:
          type: string
          minLength: 1
          maxLength: 40
          description: The server trims whitespace before validating and saving this value.
        conversationStyle:
          $ref: '#/components/schemas/ConversationStyle'
    AccountDeletionAccepted:
      type: object
      additionalProperties: false
      required: [status, requestedAt]
      properties:
        status:
          type: string
          const: pending
        requestedAt:
          type: string
          format: date-time
    Conversation:
      type: object
      additionalProperties: false
      required: [id, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    CompanionConversationResponse:
      type: object
      additionalProperties: false
      required: [conversation, created]
      properties:
        conversation:
          $ref: '#/components/schemas/Conversation'
        created:
          type: boolean
          description: True only when this request created the conversation and its greeting.
    CompanionMessagesResponse:
      type: object
      additionalProperties: false
      required: [conversation, messages, nextCursor, hasMore]
      properties:
        conversation:
          $ref: '#/components/schemas/Conversation'
        messages:
          type: array
          description: Messages in chronological order within this page.
          items:
            $ref: '#/components/schemas/Message'
        nextCursor:
          type: [string, 'null']
          description: Send this value to load the next older page. Null when no older messages remain.
        hasMore:
          type: boolean
          description: True when an older page is available.
    ReplyTarget:
      type: object
      additionalProperties: false
      required: [id, role, content]
      properties:
        id:
          type: string
          format: uuid
        role:
          type: string
          enum: [assistant]
        content:
          type: string
    Message:
      type: object
      additionalProperties: false
      required: [id, role, content, replyToMessageId, replyToMessage, createdAt]
      properties:
        id:
          type: string
          format: uuid
        role:
          type: string
          enum: [user, assistant, system]
        content:
          type: string
        replyToMessageId:
          type: [string, 'null']
          format: uuid
        replyToMessage:
          oneOf:
            - $ref: '#/components/schemas/ReplyTarget'
            - type: 'null'
        createdAt:
          type: string
          format: date-time
    MessageReportReason:
      type: string
      enum: [unsafe_content, sexual_content, hate_or_harassment, self_harm, privacy, other]
    MessageReportRequest:
      type: object
      additionalProperties: false
      required: [reason, clientRequestId]
      properties:
        reason:
          $ref: '#/components/schemas/MessageReportReason'
        details:
          type: string
          minLength: 1
          maxLength: 1000
          description: Optional explanation. The server trims whitespace before validation and saving. Retained as written, subject to trimming.
        clientRequestId:
          type: string
          format: uuid
          description: Generate one UUID per report submission. Reuse only to retry the same message ID, reason, and explanation.
    MessageReportReceipt:
      type: object
      additionalProperties: false
      required: [id, status, createdAt]
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
          const: open
          description: Receipt status at submission, not a moderation decision.
        createdAt:
          type: string
          format: date-time
    ChatRequest:
      type: object
      additionalProperties: false
      required: [message, clientRequestId]
      properties:
        message:
          type: string
          minLength: 1
          maxLength: 4000
          description: The server trims whitespace before validating and saving this value.
        clientRequestId:
          type: string
          format: uuid
          description: Generate one UUID per user send. Reuse it only to retry that same send.
        replyToMessageId:
          type: string
          format: uuid
          description: Assistant message in the canonical conversation that this message replies to.
    ChatResponse:
      type: object
      additionalProperties: false
      required:
        - reply
        - responseId
        - conversationId
        - userMessageId
        - assistantMessageId
        - userMessageCreatedAt
        - assistantMessageCreatedAt
      properties:
        reply:
          type: string
        responseId:
          type: [string, 'null']
          description: OpenAI provider response ID, not a persisted message ID.
        conversationId:
          type: string
          format: uuid
