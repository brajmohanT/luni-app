<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Luni · Welcome flow</title><style>
:root{color-scheme:light;--canvas:#f9fbfd;--surface:#eceef2;--input:#f1f3f6;--border:#e0e2e8;--control:#858b96;--text:#111318;--muted:#596171;--blue:#0054fd;--focus:#0054fd;--danger:#b42318;--stage:#e7e9ed}

*{box-sizing:border-box}body{margin:0;background:var(--stage);color:var(--text);font:16px/22px -apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif}button,input,textarea{font:inherit}button{cursor:pointer;touch-action:manipulation}button:disabled{cursor:not-allowed}button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--focus);outline-offset:3px}::selection{background:var(--blue);color:#fff}[hidden]{display:none!important}

t:400;font-size:16px;line-height:22px;caret-color:var(--focus)}.field textarea{min-height:190px;resize:vertical}.field input::placeholder{color:var(--muted)}.field input[aria-invalid=true]{border-color:var(--danger)}.error{color:var(--danger);font-size:12px;line-height:18px;min-height:18px}.actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:28px}.button{min-height:44px;border:1px solid var(--control);border-radius:99px;padding:10px 20px;background:transparent;color:var(--text);font-size:14px;font-weight:600}.primary{background:var(--blue);color:white;border-color:var(--blue)}.danger{color:var(--danger)}.button.danger{border-color:var(--danger)}.choice{display:flex;align-items:center;gap:12px;min-height:58px;padding:12px 0;border-bottom:1px solid var(--border)}.choice input{height:20px;width:20px;accent-color:var(--blue);flex-shrink:0}.sample{margin-top:24px;padding:14px;border-radius:12px;background:var(--surface);font-size:16px;line-height:22px;white-space:pre-wrap;overflow-wrap:anywhere}.sample small{display:block;font-size:12px;color:var(--muted);margin-bottom:8px}.profile{display:flex;gap:14px;align-items:center;margin-bottom:24px}.logo{width:52px;height:52px;border-radius:18px;background:var(--blue);padding:12px;flex-shrink:0}.logo svg{width:100%;height:100%;stroke:none}.profile strong{font-size:20px}.profile small{display:block;color:var(--muted);font-size:12px;margin-top:4px}.notice{padding:12px 24px;font-size:12px;line-height:18px;color:var(--muted);border-top:1px solid var(--border);margin:0;min-height:44px}dialog{width:min(390px,calc(100% - 32px));max-height:85dvh;overflow:auto;border:1px solid var(--border);border-radius:24px;padding:24px;background:var(--canvas);color:var(--text)}dialog::backdrop{background:rgb(0 0 0 / .6)}dialog h2{font-size:22px;line-height:28px;color:var(--text);margin:0 0 12px}dialog p{font-size:14px;line-height:22px;color:var(--muted)}.empty{padding:32px 0}.empty p{margin-top:8px}
@media(max-width:520px){.preview{padding:12px 16px;min-height:76px}.phone{max-width:none;width:100%;height:calc(100dvh - 76px);min-height:360px;margin:0;border-radius:0;border-left:0;border-right:0;border-bottom:0}main{padding:20px}.preview a{font-size:12px}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
.preview{max-width:1100px;flex-wrap:wrap}.preview-tools{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:12px}.preview-tools select{min-height:44px;padding:6px;background:var(--canvas);color:var(--text);border:1px solid var(--control);border-radius:8px}.preview-tools .button{padding:8px 12px;font-size:12px}.welcome-art{height:190px;border-radius:20px;background:radial-gradient(ellipse at 90% 100%,#75aeea,transparent 65%),linear-gradient(130deg,#091323,#0054fd);display:grid;place-items:center;margin-bottom:24px}.welcome-mark{width:70px;height:70px;flex-shrink:0}.welcome-mark svg{width:100%;height:100%;stroke:none}main>.welcome-mark{padding:12px;background:var(--blue);border-radius:20px;margin-bottom:32px}.wordmark{font-size:24px;line-height:28px;font-weight:600;letter-spacing:-.03em;margin:0 0 16px}.welcome-title{font-size:30px;line-height:34px;font-weight:500;letter-spacing:-.03em;white-space:pre-line;color:var(--text);margin:0 0 16px}.step-title{font-size:28px;line-height:34px;font-weight:500;letter-spacing:-.03em;color:var(--text);margin:0 0 16px}.stack{display:grid;gap:12px;margin-top:24px}.small-note,.legal{font-size:12px;line-height:18px;color:var(--muted);text-align:center;margin:16px 0 0}.text-button{min-height:44px;border:0;background:transparent;color:var(--focus);font-size:14px;padding:8px 4px;text-decoration:underline;text-underline-offset:4px}.legal .text-button{font-size:12px}main form>.primary{width:100%;margin-top:24px}main>button{display:block;width:100%;margin-top:12px}.email-address{overflow-wrap:anywhere;font-weight:600}.sample p{margin:0}.sample{margin-bottom:8px}.preview-tools label{display:flex;align-items:center;gap:6px}@media(max-width:520px){.preview{height:auto;min-height:120px;padding:10px 16px;gap:8px}.phone{height:calc(100dvh - 148px)}.preview-tools{gap:6px}.preview-tools select{max-width:118px}.welcome-art{height:150px}}</style></head><body><div class="preview"><div><strong>Luni / First visit</strong><span>Local prototype · simulated sign-in</span></div><div class="preview-tools"><label>Platform<select id="platform"><option value="android">Android</option><option value="ios">iOS</option></select></label><label>Sign-in<select id="auth-result"><option value="success">Success</option><option value="failure">Failure</option><option value="cancel">Cancelled</option></select></label><button class="button" id="theme-toggle">Dark mode</button><button class="button" id="restart">Restart</button></div></div><div class="phone"><header><button class="icon-button" id="back" aria-label="Go back"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m14 5-7 7 7 7"/></svg></button><h1 id="heading" tabindex="-1">Welcome</h1></header><main id="content"></main><p class="notice" id="notice" role="status" aria-live="polite">Preview only. No account is created and no email is sent.</p></div><dialog id="legal-modal" aria-labelledby="legal-title"><h2 id="legal-title"></h2><p>Final policy copy and links have not been supplied. This preview does not collect agreement to legal terms.</p><button class="button" id="close-legal" autofocus>Close</button></dialog><template id="brand-mark"><svg xmlns="http://www.w3.org/2000/svg" class="monogram" viewBox="400 420 450 440" role="img" aria-label="Luni logo">
  <g fill="#FFFFFF">
    <path d="M 828 493 L 815 479 L 792 468 L 770 467 L 753 471 L 740 477 L 701 505 L 564 615 L 548 623 L 526 629 L 468 630 L 445 637 L 425 654 L 414 675 L 412 705 L 421 729 L 437 746 L 458 756 L 481 758 L 502 753 L 524 740 L 694 604 L 732 589 L 785 585 L 807 577 L 825 561 L 835 541 L 836 513 Z"/>
    <path d="M 808 659 L 793 646 L 779 640 L 768 638 L 746 640 L 722 651 L 574 762 L 565 776 L 562 787 L 563 806 L 571 822 L 586 835 L 597 840 L 613 843 L 635 841 L 647 837 L 668 825 L 791 737 L 804 726 L 811 717 L 818 698 L 817 677 Z"/>
    <path d="M 514 435 L 498 439 L 486 445 L 474 454 L 463 467 L 455 482 L 452 492 L 451 505 L 450 506 L 451 521 L 455 535 L 461 547 L 470 559 L 482 569 L 495 576 L 508 580 L 512 580 L 513 581 L 533 581 L 534 580 L 546 578 L 561 571 L 571 564 L 581 554 L 589 542 L 595 527 L 595 523 L 597 517 L 597 497 L 593 481 L 587 469 L 578 457 L 565 446 L 554 440 L 541 436 L 537 436 L 536 435 Z"/>
  </g>
</svg></template><script>// Local onboarding prototype. Authentication controls simulate UI states only.
const $=id=>document.getElementById(id),main=$('content'),heading=$('heading');
let page='welcome',preferredName='',email='',tone='Warm and balanced',busy=false,timer;
const samples={'Warm and balanced':'Hey, how has your day been?','Gentle and reassuring':'Hey. Take your time. How are you feeling?','Playful and casual':'Hey! What kind of day are we having?','Direct and thoughtful':'Hey. What’s on your mind?'};
function el(tag,text,cls){const node=document.createElement(tag);if(text!==undefined)node.textContent=text;if(cls)node.className=cls;return node;}
function button(text,action,cls='button'){const b=el('button',text,cls);b.type='button';b.onclick=action;return b;}
function tell(text){$('notice').textContent=text;}
function mark(){const wrap=el('div',undefined,'welcome-mark');wrap.setAttribute('aria-hidden','true');wrap.append($('brand-mark').content.cloneNode(true));return wrap;}
function startChat(){const params=new URLSearchParams({theme:document.documentElement.dataset.theme||'light',first:'1',name:preferredName||'there',tone});location.href='chat-screen.html?'+params;}
function simulate(provider){if(busy)return;busy=true;main.querySelectorAll('button').forEach(b=>b.disabled=true);tell('Opening '+provider+' sign-in…');timer=setTimeout(()=>{busy=false;const result=$('auth-result').value;if(result==='failure'){show('welcome');tell('We couldn’t sign you in. Try again or choose another method.');}else if(result==='cancel'){show('welcome');tell('Sign-in cancelled. Choose an option when you’re ready.');}else{show('name');tell('Sign-in simulated. No account was created.');}},700);}
function show(next){clearTimeout(timer);busy=false;page=next;main.replaceChildren();main.scrollTop=0;heading.textContent=({welcome:'Welcome',email:'Sign in with email',check:'Check your email',name:'Your name',style:'Your conversation'})[page];$('back').hidden=page==='welcome';
if(page==='welcome'){
 const art=el('div',undefined,'welcome-art');art.append(mark());main.append(art,el('div','luni','wordmark'),el('h2','A little company.\nRoom to be you.','welcome-title'),el('p','Your AI companion for everyday conversations.','muted'));
 const buttons=el('div',undefined,'stack');buttons.append(button('Continue with Google',()=>simulate('Google'),'button primary'));
 if($('platform').value==='ios')buttons.append(button('Continue with Apple',()=>simulate('Apple')));
 buttons.append(button('Continue with email',()=>show('email')));main.append(buttons,el('p','Sign in or create an account to get started.','small-note'));
 const legal=el('div',undefined,'legal');legal.append(button('Terms of Service',()=>legalPreview('Terms of Service'),'text-button'),document.createTextNode(' · '),button('Privacy Policy',()=>legalPreview('Privacy Policy'),'text-button'));main.append(legal);
}else if(page==='email'){
 main.append(el('p','We’ll send you a link to sign in.','muted'));const form=el('form'),label=el('label','Email address','field'),input=el('input');input.type='email';input.autocomplete='email';input.inputMode='email';input.required=true;input.value=email;input.placeholder='you@example.com';label.append(input);form.append(label);const submit=el('button','Send sign-in link','button primary');submit.type='submit';form.append(submit);form.onsubmit=e=>{e.preventDefault();if(busy)return;email=input.value.trim();busy=true;submit.disabled=true;submit.textContent='Sending…';submit.setAttribute('aria-busy','true');tell('Simulating an email request…');timer=setTimeout(()=>{busy=false;if($('auth-result').value==='failure'){show('email');tell('Couldn’t send the link. Check your connection and try again.');}else{show('check');tell('Preview only: no email was sent.');}},700);};main.append(form);
}else if(page==='check'){
 main.append(el('p','Use the sign-in link sent to:'),el('p',email,'email-address'),el('p','Open the link on this device to continue.','muted'),button('Preview successful sign-in',()=>{show('name');tell('Email verification simulated.');},'button primary'),button('Resend link',()=>{if(busy)return;busy=true;main.querySelectorAll('button').forEach(b=>b.disabled=true);tell('Simulating resend…');timer=setTimeout(()=>{show('check');tell($('auth-result').value==='failure'?'Couldn’t resend. Try again.':'Preview only: link resent. No email was sent.');},700);}),button('Use a different email',()=>show('email'),'text-button'));
}else if(page==='name'){
 main.append(mark(),el('h2','What should I call you?','step-title'),el('p','A name or nickname is fine. You can change it in settings.','muted'));const form=el('form');form.noValidate=true;const label=el('label','Preferred name','field'),input=el('input');input.autocomplete='nickname';input.maxLength=40;input.value=preferredName;input.placeholder='Your name';input.setAttribute('aria-describedby','name-error');label.append(input);const error=el('p','','error');error.id='name-error';error.setAttribute('role','alert');const submit=el('button','Continue','button primary');submit.type='submit';form.append(label,error,submit);form.onsubmit=e=>{e.preventDefault();if(!input.value.trim()){error.textContent='Enter a name to continue.';input.setAttribute('aria-invalid','true');input.focus();return;}preferredName=input.value.trim();show('style');tell('Choose a style, or skip to start chatting.');};main.append(form);
}else if(page==='style'){
 main.append(el('h2','How would you like to talk?','step-title'),el('p','Pick a starting style. You can change this later.','muted'));const form=el('form'),sample=el('div',undefined,'sample'),sampleText=el('p',samples[tone]);sample.append(el('small','A greeting from Luni'),sampleText);for(const value of Object.keys(samples)){const label=el('label',undefined,'choice'),radio=el('input');radio.type='radio';radio.name='tone';radio.checked=value===tone;radio.onchange=()=>{tone=value;sampleText.textContent=samples[value];};label.append(radio,document.createTextNode(value));form.append(label);}const submit=el('button','Start talking','button primary');submit.type='submit';form.append(sample,submit,button('Skip for now',()=>{tone='Warm and balanced';startChat();},'text-button'));form.onsubmit=e=>{e.preventDefault();startChat();};main.append(form);
}heading.focus({preventScroll:true});}
function legalPreview(title){$('legal-title').textContent=title;$('legal-modal').showModal();}
$('close-legal').onclick=()=>$('legal-modal').close();
$('back').onclick=()=>{show(({email:'welcome',check:'email',name:'welcome',style:'name'})[page]||'welcome');};
$('theme-toggle').onclick=()=>{const dark=document.documentElement.dataset.theme!=='dark';document.documentElement.dataset.theme=dark?'dark':'light';$('theme-toggle').textContent=dark?'Light mode':'Dark mode';};
$('platform').onchange=()=>{show('welcome');tell('Platform preview changed.');};
$('restart').onclick=()=>{preferredName='';email='';tone='Warm and balanced';show('welcome');tell('Preview restarted.');};
show('welcome');
</script></body></html>
