<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Luni · Settings</title>
<style>
:root{color-scheme:light;--canvas:#f9fbfd;--surface:#eceef2;--input:#f1f3f6;--border:#e0e2e8;--control:#858b96;--text:#111318;--muted:#596171;--blue:#0054fd;--focus:#0054fd;--danger:#b42318;--stage:#e7e9ed}
:root[data-theme=dark]{color-scheme:dark;--canvas:#060709;--surface:#282a30;--input:#141619;--border:#30333b;--control:#767d89;--text:#f7f8fa;--muted:#adb3be;--focus:#75aeea;--danger:#ffb4ab;--stage:#17191e}
*{box-sizing:border-box}body{margin:0;background:var(--stage);color:var(--text);font:16px/22px -apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif}button,input,textarea{font:inherit}button{cursor:pointer;touch-action:manipulation}button:disabled{cursor:not-allowed}button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--focus);outline-offset:3px}::selection{background:var(--blue);color:#fff}[hidden]{display:none!important}
.preview{max-width:1040px;margin:auto;padding:24px;display:flex;align-items:center;justify-content:space-between;gap:16px;font-size:12px;line-height:18px}.preview strong{display:block;font-size:14px}.preview span{color:var(--muted)}.preview a{color:var(--text);padding:12px;text-underline-offset:4px;min-height:44px}.phone{max-width:430px;height:min(840px,calc(100dvh - 110px));min-height:500px;margin:0 auto 24px;background:var(--canvas);border:1px solid var(--border);border-radius:32px;overflow:hidden;display:flex;flex-direction:column}header{display:flex;align-items:center;gap:8px;padding:16px 16px 12px;border-bottom:1px solid var(--border)}h1{font-size:24px;line-height:30px;letter-spacing:-.03em;margin:0;font-weight:600}.icon-button{width:44px;height:44px;flex-shrink:0;border:0;border-radius:50%;background:transparent;color:var(--text);display:grid;place-items:center}.icon-button:hover{background:var(--surface)}svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}main{padding:24px;overflow:auto;flex:1;scrollbar-width:thin;scrollbar-color:var(--border) var(--canvas)}h2{font-size:12px;line-height:18px;color:var(--muted);font-weight:500;margin:28px 0 8px}h2:first-child{margin-top:0}p{margin:0 0 20px}.muted{color:var(--muted);font-size:14px;line-height:22px}.row{display:flex;align-items:center;justify-content:space-between;gap:16px;min-height:66px;padding:14px 0;border:0;border-bottom:1px solid var(--border);background:transparent;color:var(--text);width:100%;text-align:left}.row:hover{background:var(--input)}.row small{display:block;color:var(--muted);font-size:12px;line-height:18px;margin-top:4px}.row svg{flex-shrink:0;color:var(--muted)}.field{display:block;font-size:14px;font-weight:600;margin:20px 0}.field input,.field textarea{display:block;width:100%;border:1px solid var(--control);border-radius:12px;padding:12px 14px;color:var(--text);background:var(--input);margin-top:8px;min-height:48px;font-weight:400;font-size:16px;line-height:22px;caret-color:var(--focus)}.field textarea{min-height:190px;resize:vertical}.field input::placeholder{color:var(--muted)}.field input[aria-invalid=true]{border-color:var(--danger)}.error{color:var(--danger);font-size:12px;line-height:18px;min-height:18px}.actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:28px}.button{min-height:44px;border:1px solid var(--control);border-radius:99px;padding:10px 20px;background:transparent;color:var(--text);font-size:14px;font-weight:600}.primary{background:var(--blue);color:white;border-color:var(--blue)}.danger{color:var(--danger)}.button.danger{border-color:var(--danger)}.choice{display:flex;align-items:center;gap:12px;min-height:58px;padding:12px 0;border-bottom:1px solid var(--border)}.choice input{height:20px;width:20px;accent-color:var(--blue);flex-shrink:0}.sample{margin-top:24px;padding:14px;border-radius:12px;background:var(--surface);font-size:16px;line-height:22px;white-space:pre-wrap;overflow-wrap:anywhere}.sample small{display:block;font-size:12px;color:var(--muted);margin-bottom:8px}.profile{display:flex;gap:14px;align-items:center;margin-bottom:24px}.logo{width:52px;height:52px;border-radius:18px;background:var(--blue);padding:12px;flex-shrink:0}.logo svg{width:100%;height:100%;stroke:none}.profile strong{font-size:20px}.profile small{display:block;color:var(--muted);font-size:12px;margin-top:4px}.notice{padding:12px 24px;font-size:12px;line-height:18px;color:var(--muted);border-top:1px solid var(--border);margin:0;min-height:44px}dialog{width:min(390px,calc(100% - 32px));max-height:85dvh;overflow:auto;border:1px solid var(--border);border-radius:24px;padding:24px;background:var(--canvas);color:var(--text)}dialog::backdrop{background:rgb(0 0 0 / .6)}dialog h2{font-size:22px;line-height:28px;color:var(--text);margin:0 0 12px}dialog p{font-size:14px;line-height:22px;color:var(--muted)}.empty{padding:32px 0}.empty p{margin-top:8px}
@media(max-width:520px){.preview{padding:12px 16px;min-height:76px}.phone{max-width:none;width:100%;height:calc(100dvh - 76px);min-height:360px;margin:0;border-radius:0;border-left:0;border-right:0;border-bottom:0}main{padding:20px}.preview a{font-size:12px}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style></head><body>
<div class="preview"><div><strong>Luni / Settings flow</strong><span>Local prototype · sample data</span></div><a id="chat-link" href="chat-screen.html">Back to chat</a></div>
<div class="phone"><header><button class="icon-button" id="back" aria-label="Back"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m14 5-7 7 7 7"/></svg></button><h1 id="heading" tabindex="-1">Settings</h1></header><main id="content"></main><p class="notice" id="notice" role="status" aria-live="polite">Changes stay in this preview until you reload.</p></div>
<dialog id="confirm" aria-labelledby="confirm-title" aria-describedby="confirm-copy"><h2 id="confirm-title"></h2><p id="confirm-copy"></p><div class="actions"><button class="button" id="cancel-confirm" autofocus>Cancel</button><button class="button danger" id="accept-confirm">Confirm</button></div></dialog>
<template id="brand-mark"><svg xmlns="http://www.w3.org/2000/svg" class="monogram" viewBox="400 420 450 440" role="img" aria-label="Luni logo">
  <g fill="#FFFFFF">
    <path d="M 828 493 L 815 479 L 792 468 L 770 467 L 753 471 L 740 477 L 701 505 L 564 615 L 548 623 L 526 629 L 468 630 L 445 637 L 425 654 L 414 675 L 412 705 L 421 729 L 437 746 L 458 756 L 481 758 L 502 753 L 524 740 L 694 604 L 732 589 L 785 585 L 807 577 L 825 561 L 835 541 L 836 513 Z"/>
    <path d="M 808 659 L 793 646 L 779 640 L 768 638 L 746 640 L 722 651 L 574 762 L 565 776 L 562 787 L 563 806 L 571 822 L 586 835 L 597 840 L 613 843 L 635 841 L 647 837 L 668 825 L 791 737 L 804 726 L 811 717 L 818 698 L 817 677 Z"/>
    <path d="M 514 435 L 498 439 L 486 445 L 474 454 L 463 467 L 455 482 L 452 492 L 451 505 L 450 506 L 451 521 L 455 535 L 461 547 L 470 559 L 482 569 L 495 576 L 508 580 L 512 580 L 513 581 L 533 581 L 534 580 L 546 578 L 561 571 L 571 564 L 581 554 L 589 542 L 595 527 L 595 523 L 597 517 L 597 497 L 593 481 L 587 469 L 578 457 L 565 446 L 554 440 L 541 436 L 537 436 L 536 435 Z"/>
  </g>
</svg></template>
<script>
const $=id=>document.getElementById(id),main=$('content'),heading=$('heading');let page='settings',name='Alex',style='Warm and balanced',appearance=new URLSearchParams(location.search).get('theme')==='dark'?'Dark':'Light',memory='Alex recently finished a project and likes quiet evenings after a busy day.',selectedReminder=null;
const date=new Date();date.setDate(date.getDate()+1);const localDate=[date.getFullYear(),String(date.getMonth()+1).padStart(2,'0'),String(date.getDate()).padStart(2,'0')].join('-');
let reminders=[{id:1,title:'Take a break',date:localDate,time:'18:30'}];
const samples={'Warm and balanced':'Nice work. How does it feel to have it finished?','Gentle and reassuring':'You got through it. I hope you get a chance to rest now.','Playful and casual':'Project finished! What’s the plan for your evening?','Direct and thoughtful':'Nice work getting it done. What helped you finish?'};
function el(tag,text,cls){const e=document.createElement(tag);if(text!==undefined)e.textContent=text;if(cls)e.className=cls;return e;}
function button(text,action,cls='button'){const b=el('button',text,cls);b.type='button';b.onclick=action;return b;}
function tell(text){$('notice').textContent=text;}
function setTheme(value){appearance=value;document.documentElement.dataset.theme=value.toLowerCase();$('chat-link').href='chat-screen.html?theme='+value.toLowerCase();}
function goChat(){location.href=$('chat-link').href;}
function row(title,detail,action,danger=false){const b=button('',action,'row'+(danger?' danger':''));const label=el('span',title);if(detail)label.append(el('small',detail));b.append(label);const arrow=document.createElementNS('http://www.w3.org/2000/svg','svg');arrow.setAttribute('viewBox','0 0 24 24');arrow.setAttribute('aria-hidden','true');arrow.innerHTML='<path d="m9 5 7 7-7 7"/>';b.append(arrow);return b;}
function field(form,label,value,type='text'){const wrap=el('label',label,'field'),input=el(type==='textarea'?'textarea':'input');if(type!=='textarea')input.type=type;input.value=value;wrap.append(input);form.append(wrap);return input;}
function actions(...buttons){const group=el('div',undefined,'actions');group.append(...buttons);return group;}
function submit(form,label){const b=el('button',label,'button primary');b.type='submit';form.append(actions(button('Cancel',()=>show(({profile:'settings',style:'settings',appearance:'settings',editMemory:'memory',editReminder:'reminders'})[page]||'settings')),b));}
function confirm(title,copy,label,action){$('confirm-title').textContent=title;$('confirm-copy').textContent=copy;$('accept-confirm').textContent=label;$('accept-confirm').onclick=()=>{$('confirm').close();action();};$('confirm').showModal();}
$('cancel-confirm').onclick=()=>$('confirm').close();
function show(next){page=next;main.replaceChildren();heading.textContent=({settings:'Settings',profile:'Your profile',style:'Conversation style',appearance:'Appearance',memory:'Memory',editMemory:'Edit memory',reminders:'Reminders',editReminder:'Edit reminder',account:'Account',deleteAccount:'Delete account',signedOut:'Signed out'})[page];main.scrollTop=0;
if(page==='settings'){
const profile=el('div',undefined,'profile'),logo=el('div',undefined,'logo');logo.setAttribute('aria-hidden','true');logo.append($('brand-mark').content.cloneNode(true));const text=el('div');text.append(el('strong',name),el('small','You and Luni'));profile.append(logo,text);main.append(profile,el('h2','You and Luni'),row('Profile',name,()=>show('profile')),row('Conversation style',style,()=>show('style')),row('Memory','View and edit what Luni remembers',()=>show('memory')),el('h2','Preferences'),row('Appearance',appearance,()=>show('appearance')),row('Reminders',reminders.length?reminders.length+' upcoming':'No upcoming reminders',()=>show('reminders')),el('h2','Account'),row('Account','Sign out or manage your account',()=>show('account')));
}else if(page==='profile'){
main.append(el('p','What should Luni call you?','muted'));const form=el('form');form.noValidate=true;const input=field(form,'Preferred name',name);input.maxLength=40;input.autocomplete='nickname';const error=el('p','','error');error.id='name-error';error.setAttribute('role','alert');input.setAttribute('aria-describedby',error.id);form.append(error);submit(form,'Save name');form.onsubmit=e=>{e.preventDefault();if(!input.value.trim()){input.setAttribute('aria-invalid','true');error.textContent='Enter a name to continue.';input.focus();return;}name=input.value.trim();show('settings');tell('Preferred name saved in this preview.');};main.append(form);
}else if(page==='style'||page==='appearance'){
const isStyle=page==='style';main.append(el('p',isStyle?'Choose how Luni talks with you.':'Choose the look you prefer.','muted'));const form=el('form');let selected=isStyle?style:appearance;const example=el('div',undefined,'sample'),copy=el('p',samples[selected]);if(isStyle)example.append(el('small','You: “I finished my project.”'),copy);for(const value of isStyle?Object.keys(samples):['Light','Dark']){const label=el('label',undefined,'choice'),input=el('input');input.type='radio';input.name='selection';input.value=value;input.checked=value===selected;input.onchange=()=>{selected=value;if(isStyle)copy.textContent=samples[value];};label.append(input,document.createTextNode(value));form.append(label);}if(isStyle)form.append(example);submit(form,isStyle?'Save style':'Apply appearance');form.onsubmit=e=>{e.preventDefault();if(isStyle)style=selected;else setTheme(selected);show('settings');tell(isStyle?'Conversation style saved. Replies in chat remain scripted.':'Appearance applied to this preview.');};main.append(form);
}else if(page==='memory'){
main.append(el('p','Review the information Luni keeps from your conversations.','muted'));if(memory){main.append(el('div',memory,'sample'),actions(button('Edit memory',()=>show('editMemory'),'button primary'),button('Clear memory',()=>confirm('Clear memory?','This removes the sample memory from this preview. Chat messages stay unchanged.','Clear memory',()=>{memory='';show('memory');tell('Sample memory cleared.');}),'button danger')));}else{const empty=el('div',undefined,'empty');empty.append(el('strong','No saved memory'),el('p','Memory you save will appear here.','muted'),button('Add memory',()=>show('editMemory'),'button primary'));main.append(empty);}
}else if(page==='editMemory'){
const form=el('form'),input=field(form,'What Luni remembers',memory,'textarea');input.maxLength=4000;input.required=true;submit(form,'Save memory');form.onsubmit=e=>{e.preventDefault();if(!input.value.trim()){input.setCustomValidity('Enter a memory, or use Clear memory on the previous screen.');input.reportValidity();return;}memory=input.value.trim();show('memory');tell('Sample memory updated.');};input.oninput=()=>input.setCustomValidity('');main.append(form);
}else if(page==='reminders'){
main.append(el('p','Sample reminders · '+Intl.DateTimeFormat().resolvedOptions().timeZone,'muted'));if(!reminders.length){main.append(el('strong','No upcoming reminders'),el('p','Ask Luni in chat when you want a reminder. This prototype does not schedule alerts.','muted'),button('Back to chat',goChat,'button primary'));}for(const item of reminders)main.append(row(item.title,item.date+' · '+item.time,()=>{selectedReminder=item;show('editReminder');}));
}else if(page==='editReminder'){
const form=el('form'),title=field(form,'Reminder',selectedReminder.title),day=field(form,'Date',selectedReminder.date,'date'),time=field(form,'Time',selectedReminder.time,'time');title.maxLength=120;for(const input of [title,day,time])input.required=true;title.oninput=()=>title.setCustomValidity('');submit(form,'Save changes');form.onsubmit=e=>{e.preventDefault();if(!title.value.trim()){title.setCustomValidity('Enter a reminder.');title.reportValidity();return;}Object.assign(selectedReminder,{title:title.value.trim(),date:day.value,time:time.value});show('reminders');tell('Sample reminder updated. No alert has been scheduled.');};main.append(form,actions(button('Cancel reminder',()=>confirm('Cancel reminder?','Remove “'+selectedReminder.title+'” from this preview?','Cancel reminder',()=>{reminders=reminders.filter(r=>r.id!==selectedReminder.id);show('reminders');tell('Sample reminder removed.');}),'button danger')));
}else if(page==='account'){
main.append(el('p','Sample account · alex@example.com','muted'),row('Sign out','Keep your account and saved data',()=>confirm('Sign out?','This previews the signed-out screen. Your real session stays unchanged.','Sign out',()=>{show('signedOut');tell('Signed out in this preview only.');})),row('Delete account','Review what would be removed',()=>show('deleteAccount'),true));
}else if(page==='deleteAccount'){
main.append(el('p','Delete your account?'),el('p','Proposed account deletion would remove your profile, conversations, memories, and reminders. Final deletion and retention rules need backend confirmation.','muted'),el('p','This prototype does not delete any account data.','muted'),actions(button('Keep account',()=>show('account')),button('Preview deletion',()=>confirm('Preview account deletion?','No real account or data will be deleted. This only shows the end of the proposed flow.','Preview deletion',()=>{show('signedOut');tell('Deletion flow preview complete. No account data was deleted.');}),'button danger')));
}else if(page==='signedOut'){
main.append(el('p','You’ve reached the end of this account preview.','muted'),button('Return to settings',()=>show('settings'),'button primary'));
}heading.focus({preventScroll:true});}
$('back').onclick=()=>{if(page==='settings')goChat();else show(({editMemory:'memory',editReminder:'reminders',deleteAccount:'account'})[page]||'settings');};setTheme(appearance);show('settings');
</script></body></html>
