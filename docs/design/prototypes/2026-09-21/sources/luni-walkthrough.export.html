<details id="export-controls" style="font:14px Arial,sans-serif;max-width:420px;margin:0 auto 18px;padding:12px;border:1px solid light-dark(#aaa,#777);border-radius:8px"><summary>Preview controls</summary><div id="export-controls-fields"></div></details>
<script>
globalThis.Tweak=class {
 constructor(config){this.config=config;this.supported=true;}
 addSelect(state,key,options){
  const label=document.createElement('label');label.style.cssText='display:grid;gap:6px;margin-top:12px';label.append(document.createTextNode(options.label||key));
  const select=document.createElement('select');select.style.cssText='font:inherit;padding:8px;max-width:100%;color:light-dark(#222,#eee);background:light-dark(#fff,#292929)';
  options.options.forEach(value=>{const option=document.createElement('option');option.value=typeof value==='string'?value:value.value;option.textContent=typeof value==='string'?value:value.label;select.append(option);});
  select.value=state[key];select.onchange=()=>{state[key]=select.value;this.config.onChange();};label.append(select);document.getElementById('export-controls-fields').append(label);
 }
 addToggle(state,key,options){const label=document.createElement('label');label.style.cssText='display:flex;gap:8px;align-items:center;margin-top:12px';const input=document.createElement('input');input.type='checkbox';input.checked=state[key];input.onchange=()=>{state[key]=input.checked;this.config.onChange();};label.append(input,document.createTextNode(options.label||key));document.getElementById('export-controls-fields').append(label);}
};
</script>
<div id="luni-settings-flow" aria-label="Luni connected app walkthrough">

 <main></main>

<script>
(()=>{

 function signedIn(){if(state.login==='Failed'){show('loginError');return;}if(state.login==='Cancelled'){show('login');tell('Sign-in cancelled. Choose an option to continue.');return;}if(onboarded)enterChat();else show('name');}
 function resolveMessage(item){

   else {pendingReminder=true;chatMessages.push({role:'assistant',text:'What should I remind you about, and when?'});}
  }else if(pendingReminder){saveReminder();}
  else chatMessages.push({role:'assistant',text:item.text.toLowerCase().includes('hang out')?'I’m here. What have you been up to today?':'That sounds like a rough day. What happened?'});

 }
 function saveReminder(){const r={title:'Submit my assignment',date:'2026-09-22',time:'18:00'};reminders.push(r);chatMessages.push({role:'assistant',reminder:r});pendingReminder=null;}
 function reminderCard(r){const card=el('section',undefined,'event');card.append(el('p',r.cancelled?'Reminder cancelled':r.delivered?'Reminder · time to act':'✓ Reminder saved','hint'),el('h3',r.title),el('p',r.date+' · '+r.time),el('p','India Standard Time','hint'));if(!r.cancelled&&!r.delivered)card.append(actions(btn('Edit',()=>{activeReminder=r;editReturn='chat';show('editReminder');}),btn('Cancel reminder',()=>{r.cancelled=true;const i=reminders.indexOf(r);if(i>=0)reminders.splice(i,1);show('chat');})));return card;}
 function chat(){

  main.append(log);

  if(reminders.length&&state.notifications==='Not asked'){main.append(el('p','Allow notifications to receive reminder alerts.'),actions(btn('Enable alerts',()=>modal('Allow notifications?',box=>{box.append(el('p','System permission prompt · simulated'),actions(btn('Don’t allow',()=>{state.notifications='Off';close();show('chat');}),btn('Allow',()=>{state.notifications='Enabled';close();show('chat');},'primary')));})),btn('Not now',()=>{state.notifications='Off';show('chat');})));}
  if(reminders.length&&state.notifications==='Off')main.append(el('p','Notifications are off. Your reminder is saved, but you won’t receive an alert.','hint'));
  const form=el('form',undefined,'compose'),input=el('textarea');input.rows=1;input.placeholder='Message Luni…';input.setAttribute('aria-label','Message Luni');input.value=draft;
  const send=btn('Send',()=>{},'primary');send.type='submit';send.disabled=!draft.trim();input.oninput=()=>{draft=input.value;send.disabled=!draft.trim();};form.append(input,send);form.onsubmit=e=>{e.preventDefault();if(!draft.trim())return;const item={role:'user',text:draft.trim(),failed:state.message==='Failed'};chatMessages.push(item);draft='';if(item.failed)show('chat');else resolveMessage(item);};main.append(form,el('p','Preview: sample replies and reminder details. No messages or alerts leave this walkthrough.','hint'));
 }
 function show(next){page=next;main.replaceChildren();notice.hidden=true;root.querySelector('.chat-settings')?.remove();heading.textContent=({settings:'Settings',style:'Conversation style',onboardingStyle:'Conversation style',name:'Welcome',memory:'Memory',editMemory:'Edit memory',reminders:'Reminders',editReminder:'Edit reminder',account:'Account',deleteAccount:'Delete account',chat:'Luni',login:'Luni',email:'Sign in with email',checkEmail:'Check your email',loginError:'Sign-in failed',notification:'Notification preview'})[page];root.querySelector('.back').hidden=['login','chat','name','notification'].includes(page);
 if(['memory','reminders'].includes(page)&&state.data!=='Loaded'){
  if(state.data==='Loading'){main.append(el('p','Loading…','muted'));return;}
  if(state.data==='Error'){main.append(el('p','Couldn’t load '+(page==='memory'?'your memory.':'your reminders.')),btn('Retry',()=>{state.data='Loaded';show(page);},'primary'));return;}
  if(state.data==='Empty'){main.append(el('p',page==='memory'?'No saved memory yet.':'No upcoming reminders. Ask Luni to set one in chat.','muted'));return;}
 }
 if(page==='settings'){
 main.append(el('div','YOU AND LUNI','group'),row('Preferred name',preferredName||'Not set',nameDialog),row('Conversation style',style,()=>show('style')),row('Memory','View and edit what Luni remembers',()=>show('memory')),el('div','REMINDERS AND ALERTS','group'),row('Reminders','View, edit, or cancel upcoming reminders',()=>show('reminders')),row('Notifications',state.notifications+' · Phone settings',()=>tell('Prototype: opens your phone’s notification settings for Luni.')),el('div','ACCOUNT','group'),row('Account','Sign out or delete your account',()=>show('account')));
 }else if(page==='style'||page==='onboardingStyle'){
 main.append(el('p','Choose how Luni talks with you.','muted'));let selected=style;
 const samples={'Warm and balanced':'Nice work! How does it feel to have it finished?','Gentle and reassuring':'You got through it. I hope you get a chance to rest now.','Playful and casual':'Assignment defeated! What’s the plan for your well-earned freedom?','Direct and thoughtful':'Nice work getting it done. What helped you finish?'};
 const preview=el('div',undefined,'sample'),reply=el('p',samples[selected]);preview.append(el('small','You: “I finished my assignment.”'),reply);
 Object.keys(samples).filter(value=>page==='style'||value!=='Warm and balanced').forEach(value=>{const label=el('label',undefined,'choice'),radio=el('input');radio.type='radio';radio.name='settings-style';radio.checked=value===style;radio.onchange=()=>{selected=value;reply.textContent=samples[value];};label.append(radio,document.createTextNode(value));main.append(label);});main.append(preview,actions(btn(page==='style'?'Cancel':'Decide later',()=>page==='style'?show('settings'):enterChat()),btn(page==='style'?'Save style':'Start chatting',()=>{style=selected;if(page==='style')show('settings');else enterChat();},'primary')));
 }else if(page==='memory'){
 main.append(el('p','What Luni remembers about you from your chats.','muted'),el('p',memory||'No saved memory yet.',memory?'memory':'muted'));
 if(memory)main.append(actions(btn('Edit memory',()=>show('editMemory'),'primary'),btn('Clear memory',()=>modal('Clear memory?',box=>{box.append(el('p','This clears the combined memory text. Your chat messages will remain.'),actions(btn('Keep memory',close),btn('Clear memory',()=>{memory='';close();show('memory');})));}))));
 }else if(page==='editMemory'){
 const form=el('form'),label=el('label','Your memory'),input=el('textarea');input.id='memory-editor';label.htmlFor=input.id;input.rows=11;input.value=memory;const save=btn('Save changes',()=>{},'primary');save.type='submit';form.append(label,input,actions(btn('Cancel',()=>show('memory')),save));form.onsubmit=e=>{e.preventDefault();if(!input.value.trim()){tell('Use Clear memory to remove the entire text.');return;}memory=input.value.trim();show('memory');};main.append(form);
 }else if(page==='reminders'){
 main.append(el('p','Upcoming reminders · India Standard Time','muted'));
 if(!reminders.length)main.append(el('p','No upcoming reminders. Ask Luni to set one in chat.'));
 reminders.forEach(item=>main.append(row(item.title,item.date+' · '+item.time,()=>{activeReminder=item;editReturn='reminders';show('editReminder');})));
 }else if(page==='editReminder'){

 const save=btn('Save changes',()=>{},'primary');save.type='submit';form.append(actions(btn('Discard',()=>show(editReturn)),save));form.onsubmit=e=>{e.preventDefault();if(!title.value.trim())return;Object.assign(activeReminder,{title:title.value.trim(),date:date.value,time:time.value});show(editReturn);};main.append(form,btn('Cancel reminder',()=>modal('Cancel reminder?',box=>{box.append(el('p',activeReminder.title+' will no longer trigger an alert.'),actions(btn('Keep reminder',close),btn('Cancel reminder',()=>{activeReminder.cancelled=true;reminders.splice(reminders.indexOf(activeReminder),1);close();show(editReturn);})));})));

 main.append(el('p','Signed in as '+email,'muted'),row('Sign out','Keep your account and saved data',()=>modal('Sign out?',box=>box.append(el('p','You’ll need to sign in to return to your conversation.'),actions(btn('Stay signed in',close),btn('Sign out',()=>{close();show('login');},'primary'))))),row('Delete account','Review before deleting',()=>show('deleteAccount')));
 }else if(page==='deleteAccount'){

 }else if(page==='chat'){chat();
 }else if(page==='login'){
  const hero=el('div',undefined,'hero');hero.append(el('h3','A little company. Room to be you.'),el('p','Your AI companion for everyday conversations, with a memory for what matters to you.','muted'));const buttons=el('div',undefined,'stack');buttons.append(btn('Continue with Google',signedIn,'primary'),btn('Continue with email',()=>show('email')));main.append(hero,buttons,el('p','Sign in or create an account to get started.','hint'),el('p','For ages 18+. By continuing, you agree to our Terms of Service and Privacy Policy.','hint'));
 }else if(page==='email'){
  const form=el('form'),input=field(form,'Email address','','email');input.required=true;input.autocomplete='email';const submit=btn('Send sign-in link',()=>{},'primary');submit.type='submit';form.append(actions(submit));form.onsubmit=e=>{e.preventDefault();email=input.value;show('checkEmail');};main.append(form);
 }else if(page==='checkEmail'){main.append(el('p','We’ve sent a sign-in link to '+email+'.'),btn('Open sign-in link · preview',signedIn,'primary'),actions(btn('Resend link',()=>tell('Preview: sign-in link resent.')),btn('Change email',()=>show('email'))));
 }else if(page==='loginError'){main.append(el('p','We couldn’t sign you in. Please try again.'),btn('Retry',()=>{state.login='Success';signedIn();},'primary'));
 }else if(page==='name'){
  main.append(el('h3','What should I call you?'),el('p','A first name or nickname is fine.','muted'));const form=el('form'),input=field(form,'Name or nickname',preferredName);const next=btn('Continue',()=>{},'primary');next.type='submit';next.disabled=!input.value.trim();input.oninput=()=>{next.disabled=!input.value.trim();};form.append(actions(btn('Skip for now',()=>{preferredName='';show('onboardingStyle');}),next));form.onsubmit=e=>{e.preventDefault();if(!input.value.trim())return;preferredName=input.value.trim();show('onboardingStyle');};main.append(form);
 }else if(page==='notification'){
  main.append(el('p','Tue, 22 Sep · 6:00 PM','muted'),row('Luni · Reminder','Submit my assignment',()=>{chatMessages.push({role:'assistant',reminder:deliveredReminder});show('chat');}),el('p','Tap the notification to open its reminder in your conversation.','hint'));
 }
 }
 root.querySelector('.back').onclick=()=>show(({settings:'chat',editMemory:'memory',editReminder:editReturn,deleteAccount:'account',email:'login',checkEmail:'email',loginError:'login',onboardingStyle:'name'})[page]||'settings');
 let previousEntry=state.entry;
 function startScenario(){close();draft='';pendingReminder=null;notificationTarget=null;reminders.splice(0);if(state.entry==='New user'){onboarded=false;preferredName='';style='Warm and balanced';memory='';chatMessages=[];show('login');}else{onboarded=true;preferredName='Alex';memory=initialMemory;chatMessages=[{role:'assistant',text:'Hey Alex, how’s your day going?'},{role:'user',text:'Rough. I messed up my presentation at work.'},{role:'assistant',text:'That sounds rough. What happened?'}];if(state.entry!=='Reminder notification')reminders.push({title:'Submit my assignment',date:'2026-09-22',time:'18:00'});show(state.entry==='Reminder notification'?'notification':'chat');}}

 if(globalThis.Tweak){const tweak=new Tweak({container:root,onChange:()=>{if(previousEntry!==state.entry){previousEntry=state.entry;startScenario();}else show(page);}});tweak.addSelect(state,'entry',{label:'Walkthrough start',options:['New user','Returning user','Reminder notification']});tweak.addSelect(state,'login',{label:'Next login attempt',options:['Success','Failed','Cancelled']});tweak.addSelect(state,'message',{label:'Next message attempt',options:['Success','Failed']});tweak.addSelect(state,'data',{label:'Memory / reminders state',options:['Loaded','Loading','Empty','Error']});tweak.addSelect(state,'notifications',{label:'Notification permission',options:['Not asked','Enabled','Off']});}
